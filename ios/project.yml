# Projet Xcode généré par XcodeGen (CI TestFlight). Les sources restent celles de F1X.swiftpm,
# que l'on peut toujours ouvrir dans Swift Playgrounds sur iPad.
name: F1X
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  F1X:
    type: application
    platform: iOS
    entitlements:
      path: F1X.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxlestage.f1x
    sources:
      - path: F1X.swiftpm/App
      - path: F1X.swiftpm/Data
      - path: F1X.swiftpm/Views
      - path: Resources/Assets.xcassets
      - path: Resources/car.bin
        buildPhase: resources
      - path: Resources/start_engine.wav
        buildPhase: resources
    dependencies:
      - target: F1XWidgets
      - target: F1XWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.f1x
        PRODUCT_NAME: F1X
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: F1X
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ENABLE_PREVIEWS: YES
  # Widget « Prochain Grand Prix » et Live Activity (écran verrouillé, Dynamic Island).
  F1XWidgets:
    type: app-extension
    platform: iOS
    entitlements:
      path: Widgets/F1XWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxlestage.f1x
    sources:
      - path: Widgets
      - path: F1X.swiftpm/Views/RaceActivityAttributes.swift
      - path: F1X.swiftpm/Views/WeekendActivityAttributes.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: F1X
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.f1x.widgets
        PRODUCT_NAME: F1XWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  # App Apple Watch : prochain GP, dernière course, classements.
  F1XWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    entitlements:
      path: Watch/F1XWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxlestage.f1x
    sources:
      - path: Watch
      - path: WatchShared
    dependencies:
      - target: F1XWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: F1X
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.maxlestage.f1x
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.f1x.watchkitapp
        PRODUCT_NAME: F1XWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  # Complications des cadrans (compte à rebours, championnat).
  F1XWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    entitlements:
      path: WatchWidgets/F1XWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.maxlestage.f1x
    sources:
      - path: WatchWidgets
      - path: WatchShared
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: F1X
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.f1x.watchkitapp.widgets
        PRODUCT_NAME: F1XWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
