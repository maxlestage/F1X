[workspace]
resolver = "3"
members = ["server", "frontend", "protocol"]
# `cargo build` à la racine (Heroku) ne construit que le serveur ;
# son build.rs compile lui-même le frontend Yew en WebAssembly.
default-members = ["server"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
f1x-protocol = { path = "protocol" }
# wasm-bindgen et son générateur doivent avoir exactement la même version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-cli-support = "=0.2.129"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
