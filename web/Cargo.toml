[workspace]
resolver = "3"
members = ["server", "frontend", "protocol"]
# `cargo build` à la racine (Heroku) ne construit que le serveur ;
# son build.rs compile lui-même le frontend active en WebAssembly.
default-members = ["server"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Bibliothèque front-end (vues, état, routeur, SEO) : github.com/maxlestage/Active.
active = { git = "https://github.com/maxlestage/Active", rev = "a6eccd0cab7918218270e7e45a569aace05d1295" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
f1x-protocol = { path = "protocol" }
# wasm-bindgen et son générateur doivent avoir exactement la même version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-cli-support = "=0.2.129"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
