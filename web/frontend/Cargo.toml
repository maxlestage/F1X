[package]
name = "f1x-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
f1x-protocol.workspace = true
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "console", "CssStyleDeclaration", "EventTarget", "HtmlCanvasElement", "Node", "Performance", "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation", "WebGlVertexArrayObject", "Document", "DomRect", "HtmlAnchorElement", "Url", "Element", "Event", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Location", "Navigator", "PointerEvent", "Storage", "Window"] }
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
