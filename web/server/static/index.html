<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="color-scheme" content="dark">
  <title>F1X — Toute la Formule 1 dans ta poche</title>
  <meta name="description" content="Calendrier, résultats, classements, Race Center en temps réel, circuits et monoplaces en 3D, 75 ans d'archives de Formule 1. Gratuit, sans compte, pensé pour le mobile.">
  <meta name="application-name" content="F1X">
  <meta name="apple-mobile-web-app-title" content="F1X">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="canonical" href="{{ORIGIN}}/">
  <!-- Fiche de partage (Open Graph / X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="F1X">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:locale:alternate" content="en_GB">
  <meta property="og:url" content="{{ORIGIN}}/">
  <meta property="og:title" content="F1X — Toute la Formule 1 dans ta poche">
  <meta property="og:description" content="Race Center en temps réel, circuits et monoplaces en 3D, 75 ans d'archives. Gratuit, sans compte.">
  <meta property="og:image" content="{{ORIGIN}}/static/img/og-fr.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="F1X, l'application Formule 1 : accueil et monoplace en 3D sur téléphone">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="F1X — Toute la Formule 1 dans ta poche">
  <meta name="twitter:description" content="Race Center en temps réel, circuits et monoplaces en 3D, 75 ans d'archives. Gratuit, sans compte.">
  <meta name="twitter:image" content="{{ORIGIN}}/static/img/og-fr.png">
  <!-- Icônes et application installable -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{CSS}}">
</head>
<body>
  <div id="app"><div class="boot"><span class="brand"><span class="brand-mark">F1</span><span class="brand-x">X</span></span></div></div>
  <noscript><p class="boot">F1X a besoin de JavaScript/WebAssembly activé. · F1X needs JavaScript/WebAssembly.</p></noscript>
  <!-- Seul JS du site : démarrer le module WebAssembly généré depuis le code Rust (Yew),
       avec un filet de sécurité si le démarrage échoue ou n'aboutit pas. -->
  <script>
    (function () {
      var started = false;
      window.__f1xCar = "/static/car.bin?v={{CAR}}";
      window.__f1xStarted = function () { started = true; };
      function fail(reason, force) {
        if (started && !force) return;
        var fr = !/^en/i.test(navigator.language || "");
        var app = document.getElementById("app");
        if (!app) return;
        app.innerHTML =
          '<div class="boot"><div class="boot-error">' +
          '<p><strong>' + (fr ? "F1X n'a pas pu démarrer." : "F1X could not start.") + '</strong></p>' +
          '<p>' + (fr ? "Recharge la page (la dernière version sera téléchargée)." : "Reload the page to get the latest version.") + '</p>' +
          '<button class="btn" onclick="location.reload()">' + (fr ? "Recharger" : "Reload") + '</button>' +
          '<small>' + String(reason).replace(/[<>&]/g, "") + '</small></div></div>';
      }
      window.__f1xFail = fail;
      import("/pkg/{{APP}}/f1x_frontend.js")
        .then(function (m) { return m.default({ module_or_path: "/pkg/{{APP}}/f1x_frontend_bg.wasm" }); })
        .catch(fail);
      setTimeout(function () { fail("timeout"); }, 25000);

      // Application installable : invite d'installation différée (Chrome, Edge, Android)…
      addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__f1xDeferred = e;
        dispatchEvent(new Event("f1x-installable"));
      });
      addEventListener("appinstalled", function () { window.__f1xDeferred = null; });
      // … et service worker : démarrage instantané et consultation hors ligne.
      if ("serviceWorker" in navigator) {
        addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
      }
    })();
  </script>
</body>
</html>
