name: Sonde (temporaire)

# Diagnostic ponctuel : interroge le serveur F1X en ligne et OpenF1. À supprimer après usage.
on:
  push:
    branches-ignore: [master, captures-ios]
    paths: [".github/workflows/sonde.yml"]

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Serveur F1X
        run: |
          base=https://f1x-29170430865f.herokuapp.com
          for p in "api/f1/2026/17/qualifying.json?limit=100" "api/f1/current/17/qualifying.json?limit=100" "api/of1/sessions?year=2026"; do
            echo "=== $p"
            curl -sS -m 60 "$base/$p" | head -c 1500; echo
          done
      - name: OpenF1 direct
        run: |
          echo "=== séances de qualifs 2026"
          curl -sS -m 60 "https://api.openf1.org/v1/sessions?year=2026&session_type=Qualifying" | python3 -c "
          import json,sys
          for s in json.load(sys.stdin)[-6:]: print(s.get('session_key'), s.get('session_name'), s.get('date_start'), s.get('date_end'), s.get('location'))"
          key=$(curl -sS -m 60 "https://api.openf1.org/v1/sessions?year=2026&session_name=Sprint%20Qualifying" | python3 -c "import json,sys; l=json.load(sys.stdin); print(l[-1]['session_key'] if l else '')")
          echo "=== session_result $key"
          curl -sS -m 60 -w '\nHTTP %{http_code}\n' "https://api.openf1.org/v1/session_result?session_key=$key" | head -c 1500; echo
